[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nautobot_plugin_example"
version = "0.1.0"
authors = [
    { name="David Rosario", email="david@lavacro.com" },
]
description = "[My Nautobot Plugin Example]"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "nautobot>=1.5.0"
]

[project.urls]
Homepage = "https://github.com/[your-github-username]/[your-repo-name]" # Optional
"Bug Tracker" = "https://github.com/[your-github-username]/[your-repo-name]/issues" # Optional
