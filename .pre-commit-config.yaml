repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/psf/black
  rev: 25.12.0
  hooks:
  - id: black
    args: [--line-length=120]
    files: ^.*\.py$
- repo: https://github.com/pycqa/pylint
  rev: v3.2.6
  hooks:
  - id: pylint
    args: [--rcfile=.pylintrc]
    files: ^.*\.py$
